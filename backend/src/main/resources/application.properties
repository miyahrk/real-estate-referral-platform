spring.application.name=referral-platform

# ローカル開発用のDB接続情報は application-local.properties（Git管理外）に記述する。
# 初回セットアップ時は application-local.properties.example をコピーして使う。
spring.config.import=optional:application-local.properties

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=8080
